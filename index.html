<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FleetIQ — تسجيل الدخول</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Tajawal',sans-serif;direction:rtl;
  min-height:100vh;background:#0f1117;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}

/* Animated background */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.18;animation:bf 16s ease-in-out infinite}
.b1{width:600px;height:600px;background:#f59e0b;top:-200px;right:-100px;animation-delay:0s}
.b2{width:500px;height:500px;background:#1a1a2e;bottom:-150px;left:-80px;animation-delay:-6s;opacity:.35}
.b3{width:350px;height:350px;background:#3b82f6;top:50%;left:40%;animation-delay:-11s;opacity:.1}
@keyframes bf{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(25px,-20px) scale(1.04)}}

/* Card */
.card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;padding:42px 40px;
  width:420px;
  box-shadow:0 28px 72px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
}

/* Logo */
.logo-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:32px}
.logo-icon{
  width:52px;height:52px;border-radius:14px;
  background:linear-gradient(145deg,#f59e0b,#d97706);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 8px 28px rgba(245,158,11,.4);
}
.logo-info{text-align:right}
.logo-name{font-size:24px;font-weight:900;color:#fff;letter-spacing:-.5px}
.logo-tag{font-size:11px;color:rgba(255,255,255,.35);margin-top:1px;font-weight:500}

/* Divider */
.divider{height:1px;background:rgba(255,255,255,.07);margin-bottom:28px}

/* Fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.38);margin-bottom:7px;letter-spacing:.5px}
.field input{
  width:100%;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;padding:12px 15px;
  font-size:14px;color:#fff;
  font-family:'Tajawal',sans-serif;outline:none;
  transition:all .2s;
}
.field input:focus{
  border-color:#f59e0b;
  background:rgba(255,255,255,.09);
  box-shadow:0 0 0 3px rgba(245,158,11,.12);
}
.field input::placeholder{color:rgba(255,255,255,.2)}

/* Error */
.err-box{
  background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);
  border-radius:10px;padding:11px 14px;font-size:13px;
  color:#fca5a5;margin-bottom:14px;display:none;
  font-weight:500;
}
.err-box.show{display:block}

/* Submit */
.submit{
  width:100%;
  background:linear-gradient(145deg,#f59e0b,#d97706);
  color:#000;border:none;border-radius:11px;
  padding:14px;font-size:14px;font-weight:800;
  cursor:pointer;font-family:'Tajawal',sans-serif;
  margin-top:6px;transition:all .2s;
  box-shadow:0 6px 20px rgba(245,158,11,.35);
}
.submit:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(245,158,11,.45)}
.submit:active{transform:translateY(0)}
.submit:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* Demo hint */
.hint{
  margin-top:24px;padding-top:20px;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-between;
}
.hint-label{font-size:11.5px;color:rgba(255,255,255,.25)}
.hint-code{
  font-size:11.5px;color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:5px 12px;border-radius:7px;cursor:pointer;
  transition:all .15s;direction:ltr;font-weight:600;
}
.hint-code:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="card">
  <div class="logo-row">
    <div class="logo-icon">⛽</div>
    <div class="logo-info">
      <div class="logo-name">FleetIQ</div>
      <div class="logo-tag">نظام إدارة الوقود</div>
    </div>
  </div>

  <div class="divider"></div>

  <div id="err-box" class="err-box"></div>

  <div class="field">
    <label>اسم المستخدم</label>
    <input id="inp-user" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username">
  </div>
  <div class="field">
    <label>كلمة المرور</label>
    <input id="inp-pass" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
  </div>

  <button class="submit" id="btn-login" onclick="doLogin()">تسجيل الدخول</button>

  <div class="hint">
    <span class="hint-label">للتجربة:</span>
    <span class="hint-code" onclick="fillDemo()" title="اضغط للملء التلقائي">admin / 1234</span>
  </div>
</div>

<script>
const DB_KEY='fleetiq_fuel_db';

function getDB(){
  try{
    const r=localStorage.getItem(DB_KEY);
    if(r)return JSON.parse(r);
  }catch(e){}
  return buildInitialDB();
}
function saveDB(db){
  try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){console.error('saveDB failed',e);}
}
function buildInitialDB(){
  const db={
    users:[
      {id:1,name:'مدير النظام',username:'admin',password:'1234',role:'admin',active:true,lastLogin:null},
    ],
    tanks:[
      {id:1,name:'خزان بنزين 91 — الرئيسي',fuel:'petrol',capacity:5000,current:3200,unit:'لتر',price:2.18,location:'محطة A'},
      {id:2,name:'خزان ديزل — الرئيسي',fuel:'diesel',capacity:10000,current:7800,unit:'لتر',price:1.82,location:'محطة A'},
    ],
    movements:[
      {id:1,type:'receive',fuel:'petrol',liters:2000,tankId:1,plate:null,driver:null,cost:4360,note:'استلام من الشركة',userId:1,date:'2026-03-01 08:00'},
      {id:2,type:'dispense',fuel:'petrol',liters:80,tankId:1,plate:'7147-BAT',driver:'جمال السعيدي',cost:174.4,note:'',userId:1,date:'2026-03-05 09:30'},
      {id:3,type:'receive',fuel:'diesel',liters:5000,tankId:2,plate:null,driver:null,cost:9100,note:'استلام من الشركة',userId:1,date:'2026-03-01 08:30'},
      {id:4,type:'dispense',fuel:'diesel',liters:150,tankId:2,plate:'3288-ARQ',driver:'عبدالغني عزمان',cost:273,note:'',userId:1,date:'2026-03-10 11:00'},
    ],
    vehicles:[
      {id:1,plate:'7147-BAT',fuel:'petrol',type:'نقل',brand:'Toyota Hilux',driver:'جمال السعيدي'},
      {id:2,plate:'8876-BTR',fuel:'petrol',type:'نقل',brand:'Mitsubishi L200',driver:'مصطفى مقاولات'},
      {id:3,plate:'3288-ARQ',fuel:'diesel',type:'شاحنة',brand:'Volvo FH Truck',driver:'عبدالغني عزمان'},
      {id:4,plate:'1836-BTO',fuel:'diesel',type:'شاحنة',brand:'Mercedes Actros',driver:'أكرام دخسان'},
    ],
    suppliers:[
      {id:1,name:'أرامكو السعودية',contact:'قسم الوقود',phone:'920000000',whatsapp:'966920000000',city:'الرياض',notes:'المورد الرئيسي'},
    ],
    activity:[
      {id:1,action:'تهيئة النظام',details:'تم إنشاء قاعدة البيانات',userId:1,userName:'النظام',date:'2026-03-20 08:00'},
    ],
    settings:{theme:'light',companyName:'FleetIQ',nextId:{movement:5,tank:3,vehicle:5,supplier:2,activity:2,user:2}},
  };
  saveDB(db);
  return db;
}

// Auto-redirect if already logged in
try{
  const s=JSON.parse(sessionStorage.getItem('fiq_session'));
  if(s&&s.id&&s.name){window.location.replace('dashboard.html');}
}catch(e){}

function fillDemo(){
  document.getElementById('inp-user').value='admin';
  document.getElementById('inp-pass').value='1234';
  document.getElementById('inp-pass').focus();
}

function showErr(msg){
  const el=document.getElementById('err-box');
  el.textContent='⚠️ '+msg;el.classList.add('show');
}
function clearErr(){
  document.getElementById('err-box').classList.remove('show');
}

function doLogin(){
  clearErr();
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value.trim();
  const btn=document.getElementById('btn-login');

  if(!u){showErr('الرجاء إدخال اسم المستخدم');return;}
  if(!p){showErr('الرجاء إدخال كلمة المرور');return;}

  btn.disabled=true;
  btn.textContent='⏳ جاري التحقق...';

  setTimeout(()=>{
    try{
      const db=getDB();
      const user=db.users.find(x=>
        x.username===u && x.password===p && x.active!==false
      );

      if(!user){
        showErr('اسم المستخدم أو كلمة المرور غير صحيحة');
        btn.disabled=false;
        btn.textContent='تسجيل الدخول';
        return;
      }

      // حفظ الجلسة
      sessionStorage.setItem('fiq_session', JSON.stringify({
        id:user.id, name:user.name, username:user.username, role:user.role
      }));

      // تحديث آخر دخول
      user.lastLogin = new Date().toLocaleString('ar-SA');

      // تسجيل النشاط
      if(!db.settings)db.settings={};
      if(!db.settings.nextId)db.settings.nextId={};
      if(!db.activity)db.activity=[];
      const actId=(db.settings.nextId.activity||2);
      db.activity.unshift({
        id:actId, action:'تسجيل دخول',
        details:user.name+' — '+user.role,
        userId:user.id, userName:user.name,
        date:new Date().toLocaleString('ar-SA')
      });
      db.settings.nextId.activity=actId+1;
      saveDB(db);

      btn.textContent='✓ تم التحقق...';
      setTimeout(()=>{ window.location.replace('dashboard.html'); },350);

    }catch(err){
      console.error('Login error:',err);
      showErr('خطأ في النظام: '+err.message);
      btn.disabled=false;
      btn.textContent='تسجيل الدخول';
    }
  },400);
}
</script>
</body>
</html>
