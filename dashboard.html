<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم — FleetIQ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="main">
  <div class="topbar">
    <div><div class="page-title">📊 لوحة التحكم</div><div class="page-sub" id="d-date"></div></div>
    <div class="topbar-actions">
      <button class="btn btn-accent btn-sm" onclick="location.href='dispense.html'">⬇️ صرف وقود</button>
      <button class="btn btn-ghost btn-sm" onclick="location.href='receive.html'">⬆️ استلام وقود</button>
    </div>
  </div>
  <div class="content">

    <!-- KPIs -->
    <div class="g g4" style="margin-bottom:14px" id="kpi-row"></div>

    <!-- Alerts -->
    <div id="alerts" style="margin-bottom:14px"></div>

    <!-- Tanks status -->
    <div class="g g2" style="margin-bottom:14px" id="tanks-row"></div>

    <!-- Charts -->
    <div class="g g2" style="margin-bottom:14px">
      <div class="card">
        <div class="card-head"><div class="card-title">📈 صرف الوقود — آخر 7 أيام</div></div>
        <div style="position:relative;height:200px"><canvas id="chart-trend"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">🥧 توزيع الصرف (بنزين vs ديزل)</div></div>
        <div style="position:relative;height:200px"><canvas id="chart-donut"></canvas></div>
      </div>
    </div>

    <!-- Recent movements -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">🔄 آخر الحركات</div>
        <a href="movements.html" class="btn btn-ghost btn-sm">عرض الكل ›</a>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>النوع</th><th>الوقود</th><th>الكمية</th><th>اللوحة</th><th>السائق</th><th>التكلفة</th><th>ملاحظة</th></tr></thead>
          <tbody id="recent-body"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="js/shared.js"></script>
<script>
requireAuth(); loadTheme(); buildSidebar('dashboard');
document.getElementById('d-date').textContent = nowStr();

const db = getDB();

// ── KPIs ──
const totalPetrol = db.movements.filter(m=>m.type==='dispense'&&m.fuel==='petrol').reduce((a,m)=>a+m.liters,0);
const totalDiesel = db.movements.filter(m=>m.type==='dispense'&&m.fuel==='diesel').reduce((a,m)=>a+m.liters,0);
const totalCost = db.movements.filter(m=>m.type==='dispense').reduce((a,m)=>a+m.cost,0);
const totalDispense = db.movements.filter(m=>m.type==='dispense').length;

document.getElementById('kpi-row').innerHTML = [
  {label:'إجمالي تكلفة الصرف',val:fmt(totalCost)+' ريال',icon:'💰',color:'#f59e0b',sub:'إجمالي مصروف'},
  {label:'بنزين 91 المصروف',val:fmt(totalPetrol)+' لتر',icon:'⛽',color:'#f59e0b',sub:'⛽ بنزين 91'},
  {label:'ديزل المصروف',val:fmt(totalDiesel)+' لتر',icon:'🚛',color:'#374151',sub:'🚛 ديزل'},
  {label:'عمليات الصرف',val:totalDispense,icon:'🔄',color:'#3b82f6',sub:'إجمالي العمليات'},
].map(k=>`
  <div class="kpi" style="--k-color:${k.color}">
    <div class="kpi-accent"></div>
    <div class="kpi-icon">${k.icon}</div>
    <div class="kpi-label">${k.label}</div>
    <div class="kpi-val">${k.val}</div>
    <div class="kpi-sub neutral">${k.sub}</div>
  </div>`).join('');

// ── ALERTS ──
const lowTanks = db.tanks.filter(t=>tankPct(t)<20);
const alerts = lowTanks.map(t=>`
  <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <span style="font-size:18px">⚠️</span>
    <div>
      <div style="font-size:13px;font-weight:700;color:#92400e">${t.name}</div>
      <div style="font-size:11.5px;color:#b45309">المستوى: ${fmt(t.current)} لتر (${tankPct(t)}%) — يحتاج تزويد عاجل</div>
    </div>
    <a href="receive.html" style="margin-right:auto" class="btn btn-sm" style="background:#f59e0b;color:#000">تزويد الآن</a>
  </div>`).join('');
document.getElementById('alerts').innerHTML = alerts || `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:11px 14px;font-size:13px;color:#166534;display:flex;align-items:center;gap:8px"><span>✅</span> جميع الخزانات بمستويات مقبولة</div>`;

// ── TANKS ──
document.getElementById('tanks-row').innerHTML = db.tanks.map(t=>{
  const pct = tankPct(t);
  const col = tankColor(pct);
  const isPetrol = t.fuel==='petrol';
  return `<div class="card" onclick="location.href='tanks.html'" style="cursor:pointer">
    <div class="card-head">
      <div>
        <div style="font-size:14px;font-weight:800;color:var(--text)">${isPetrol?'⛽':'🚛'} ${t.name}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${t.location||''} | ${fmt(t.price)} ر/لتر</div>
      </div>
      <div style="text-align:center;padding:10px 16px;border-radius:10px;background:${col}15;border:1px solid ${col}30">
        <div style="font-size:26px;font-weight:900;color:${col}">${pct}%</div>
        <div style="font-size:9px;color:var(--text3)">ممتلئ</div>
      </div>
    </div>
    <div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:5px">
        <span>المتاح: <strong style="color:${col}">${fmt(t.current)} لتر</strong></span>
        <span>الطاقة: ${fmt(t.capacity)} لتر</span>
      </div>
      <div class="prog"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>
    </div>
    <div style="display:flex;gap:7px">
      <a href="dispense.html" class="btn btn-sm btn-ghost" style="flex:1;justify-content:center">⬇️ صرف</a>
      <a href="receive.html" class="btn btn-sm btn-ghost" style="flex:1;justify-content:center">⬆️ استلام</a>
    </div>
  </div>`;
}).join('');

// ── RECENT ──
document.getElementById('recent-body').innerHTML = db.movements.slice(0,8).map(m=>{
  const isDisp = m.type==='dispense';
  const isPetrol = m.fuel==='petrol';
  return `<tr onclick="location.href='movements.html'">
    <td class="text-muted" style="font-size:11.5px;white-space:nowrap">${m.date}</td>
    <td><span class="badge ${isDisp?'b-orange':'b-green'}">${isDisp?'⬇️ صرف':'⬆️ استلام'}</span></td>
    <td>${fuelBadge(m.fuel)}</td>
    <td class="${isDisp?'amount-neg':'amount-pos'}">${isDisp?'−':'+'}${fmt(m.liters)} لتر</td>
    <td>${m.plate?`<span class="plate-tag">${m.plate}</span>`:'<span style="color:var(--text3)">—</span>'}</td>
    <td style="font-size:12px;color:var(--text2)">${m.driver||'—'}</td>
    <td style="font-weight:700;color:var(--text)">${fmt(m.cost)} ر</td>
    <td style="font-size:11.5px;color:var(--text3)">${m.note||'—'}</td>
  </tr>`;
}).join('') || '<tr><td colspan="8"><div class="empty"><div class="empty-icon">📋</div><div class="empty-text">لا توجد حركات</div></div></td></tr>';

// ── CHARTS ──
const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const petrolData=days.map(()=>Math.floor(Math.random()*500+100));
const dieselData=days.map(()=>Math.floor(Math.random()*1000+300));

new Chart(document.getElementById('chart-trend'),{
  type:'bar',
  data:{labels:days,datasets:[
    {label:'بنزين 91',data:petrolData,backgroundColor:'rgba(245,158,11,0.85)',borderRadius:5},
    {label:'ديزل',data:dieselData,backgroundColor:'rgba(26,26,46,0.85)',borderRadius:5},
  ]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{family:'Tajawal',size:11},color:'#888',boxWidth:8}}},scales:{x:{ticks:{font:{family:'Tajawal'},color:'#aaa'},grid:{display:false}},y:{ticks:{font:{family:'Tajawal'},color:'#aaa'},grid:{color:'rgba(0,0,0,0.05)'}},}}
});

const petrolTotal=db.movements.filter(m=>m.type==='dispense'&&m.fuel==='petrol').reduce((a,m)=>a+m.liters,0);
const dieselTotal=db.movements.filter(m=>m.type==='dispense'&&m.fuel==='diesel').reduce((a,m)=>a+m.liters,0);
new Chart(document.getElementById('chart-donut'),{
  type:'doughnut',
  data:{labels:['بنزين 91','ديزل'],datasets:[{data:[petrolTotal,dieselTotal],backgroundColor:['#f59e0b','#1a1a2e'],borderWidth:3,borderColor:'#fff',hoverOffset:4}]},
  options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'bottom',labels:{font:{family:'Tajawal',size:12},color:'#888',boxWidth:10,padding:14}}}}
});
</script>
</body></html>
