<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل النشاط</title><link rel="stylesheet" href="css/main.css"></head>
<body><div class="main">
<div class="topbar"><div><div class="page-title">🕐 سجل النشاط</div><div class="page-sub">جميع الإجراءات المسجلة</div></div><div class="topbar-actions"><button class="btn btn-success btn-sm" onclick="exportCSV()">⬇️ تصدير</button><button class="btn btn-danger btn-sm" onclick="clearLog()">🗑️ مسح</button></div></div>
<div class="content">
<div style="display:flex;gap:8px;margin-bottom:12px">
<div class="search-wrap" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input class="search-input" id="q" placeholder="ابحث..." oninput="render()"></div>
<input type="date" id="df" class="form-input" style="width:150px" onchange="render()">
<button class="btn btn-ghost btn-sm" onclick="document.getElementById('q').value='';document.getElementById('df').value='';render()">مسح الفلتر</button>
</div>
<div class="card"><div class="card-head"><div class="card-title">السجل الكامل</div><div id="cnt" style="font-size:11px;color:var(--text3)"></div></div><div id="list"></div></div>
</div></div>
<script src="js/shared.js"></script>
<script>
requireAuth();loadTheme();buildSidebar('activity');
const ICONS={'تسجيل دخول':'🔐','صرف وقود':'⬇️','استلام وقود':'⬆️','إضافة خزان':'⛽','حذف خزان':'🗑️','إضافة مركبة':'🚗','إضافة مورد':'🏪','إضافة مستخدم':'👤','تعديل مستخدم':'✏️','حذف مستخدم':'🗑️','تفعيل مستخدم':'✅','إيقاف مستخدم':'⏸️'};
function render(){
  const db=getDB(),q=document.getElementById('q').value.toLowerCase(),df=document.getElementById('df').value;
  let acts=db.activity.filter(a=>{
    if(q&&!a.action.toLowerCase().includes(q)&&!a.details.toLowerCase().includes(q)&&!(a.userName||'').toLowerCase().includes(q))return false;
    if(df&&!a.date.includes(df))return false;
    return true;
  });
  document.getElementById('cnt').textContent=acts.length+' سجل';
  document.getElementById('list').innerHTML=acts.map(a=>`
    <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:32px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${ICONS[a.action]||'📌'}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--text)">${a.action}</div><div style="font-size:11.5px;color:var(--text2);margin-top:2px">${a.details}</div></div>
      <div style="text-align:left"><div style="font-size:11px;color:var(--text3)">${a.date}</div><div style="font-size:10px;color:var(--accent);margin-top:2px;font-weight:600">${a.userName||'النظام'}</div></div>
    </div>`).join('')||'<div style="text-align:center;padding:30px;color:var(--text3);font-size:13px">لا توجد سجلات</div>';
}
function clearLog(){if(!confirm('مسح كل سجل النشاط؟'))return;const db=getDB();db.activity=[];saveDB(db);render();toast('🗑️ تم المسح');}
function exportCSV(){const db=getDB();const csv='\uFEFFالتاريخ,الإجراء,التفاصيل,المستخدم\n'+db.activity.map(a=>`${a.date},${a.action},"${a.details}",${a.userName||'نظام'}`).join('\n');const el=document.createElement('a');el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));el.download='سجل_النشاط.csv';el.click();toast('✅ تم التصدير','success');}
render();
</script></body></html>
