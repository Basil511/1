<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقارير</title><link rel="stylesheet" href="css/main.css"></head>
<body><div class="main">
<div class="topbar"><div><div class="page-title">📊 التقارير</div><div class="page-sub">تقارير الوقود التفصيلية</div></div><div class="topbar-actions"><button class="btn btn-success btn-sm" onclick="exportCSV()">⬇️ تصدير Excel</button><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ طباعة</button></div></div>
<div class="content">
<div class="card" style="margin-bottom:14px">
<div class="filter-row"><span style="font-size:12px;font-weight:700;color:var(--text2)">التقرير:</span>
<button class="flt active" data-r="summary" onclick="setR(this)">ملخص عام</button>
<button class="flt" data-r="vehicles" onclick="setR(this)">🚗 مركبات</button>
<button class="flt" data-r="daily" onclick="setR(this)">📅 يومي</button>
<button class="flt" data-r="tanks" onclick="setR(this)">⛽ خزانات</button>
</div></div>
<div class="g g4" style="margin-bottom:14px" id="r-kpis"></div>
<div class="card" id="r-content"></div>
</div></div>
<script src="js/shared.js"></script>
<script>
requireAuth();loadTheme();buildSidebar('reports');
let ar='summary';
function setR(btn){document.querySelectorAll('.flt').forEach(b=>b.classList.remove('active'));btn.classList.add('active');ar=btn.dataset.r;render();}
function render(){
  const db=getDB();
  const disp=db.movements.filter(m=>m.type==='dispense');
  const recv=db.movements.filter(m=>m.type==='receive');
  const pDisp=disp.filter(m=>m.fuel==='petrol');
  const dDisp=disp.filter(m=>m.fuel==='diesel');

  document.getElementById('r-kpis').innerHTML=[
    {l:'إجمالي الصرف',v:fmt(disp.reduce((a,m)=>a+m.liters,0))+' لتر',i:'🔄',c:'#f59e0b'},
    {l:'تكلفة الصرف',v:fmt(disp.reduce((a,m)=>a+m.cost,0))+' ر',i:'💰',c:'#374151'},
    {l:'عمليات الصرف',v:disp.length,i:'📋',c:'#3b82f6'},
    {l:'الاستلامات',v:recv.length,i:'⬆️',c:'var(--green)'},
  ].map(k=>`<div class="kpi" style="--k-color:${k.c}"><div class="kpi-accent"></div><div class="kpi-icon">${k.i}</div><div class="kpi-label">${k.l}</div><div class="kpi-val">${k.v}</div></div>`).join('');

  const rc=document.getElementById('r-content');
  if(ar==='summary'){
    rc.innerHTML=`<div class="card-head"><div class="card-title">ملخص عام</div></div>
    <div class="g g2" style="gap:14px">
    <div><div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--accent)">⛽ بنزين 91</div>
    <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"><span style="color:var(--text2)">إجمالي الصرف</span><strong>${fmt(pDisp.reduce((a,m)=>a+m.liters,0))} لتر</strong></div>
    <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"><span style="color:var(--text2)">التكلفة</span><strong>${fmt(pDisp.reduce((a,m)=>a+m.cost,0))} ريال</strong></div>
    <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"><span style="color:var(--text2)">عدد العمليات</span><strong>${pDisp.length}</strong></div>
    </div></div>
    <div><div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--text2)">🚛 ديزل</div>
    <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"><span style="color:var(--text2)">إجمالي الصرف</span><strong>${fmt(dDisp.reduce((a,m)=>a+m.liters,0))} لتر</strong></div>
    <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"><span style="color:var(--text2)">التكلفة</span><strong>${fmt(dDisp.reduce((a,m)=>a+m.cost,0))} ريال</strong></div>
    <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg);border-radius:8px;font-size:13px"><span style="color:var(--text2)">عدد العمليات</span><strong>${dDisp.length}</strong></div>
    </div></div></div>`;
  } else if(ar==='vehicles'){
    const byVehicle={};
    disp.forEach(m=>{if(!m.plate)return;if(!byVehicle[m.plate])byVehicle[m.plate]={liters:0,cost:0,count:0,fuel:m.fuel};byVehicle[m.plate].liters+=m.liters;byVehicle[m.plate].cost+=m.cost;byVehicle[m.plate].count++;});
    const sorted=Object.entries(byVehicle).sort((a,b)=>b[1].cost-a[1].cost);
    rc.innerHTML='<div class="card-head"><div class="card-title">الصرف حسب المركبة</div></div><div class="tbl-wrap"><table><thead><tr><th>اللوحة</th><th>الوقود</th><th>الاستهلاك</th><th>التكلفة</th><th>عدد العمليات</th></tr></thead><tbody>'+sorted.map(([p,d])=>`<tr><td><span class="plate-tag">${p}</span></td><td>${fuelBadge(d.fuel)}</td><td style="font-weight:700">${fmt(d.liters)} لتر</td><td style="font-weight:700">${fmt(d.cost)} ر</td><td>${d.count}</td></tr>`).join('')+'</tbody></table></div>';
  } else if(ar==='tanks'){
    rc.innerHTML='<div class="card-head"><div class="card-title">حالة الخزانات</div></div><div class="tbl-wrap"><table><thead><tr><th>الخزان</th><th>الوقود</th><th>المتاح</th><th>الطاقة</th><th>النسبة</th><th>قيمة المتاح</th></tr></thead><tbody>'+db.tanks.map(t=>{const pct=tankPct(t);const col=tankColor(pct);return`<tr><td class="td-main">${t.name}</td><td>${fuelBadge(t.fuel)}</td><td style="font-weight:800;color:${col}">${fmt(t.current)} لتر</td><td style="color:var(--text3)">${fmt(t.capacity)} لتر</td><td><div style="display:flex;align-items:center;gap:6px"><div class="prog" style="flex:1"><div class="prog-fill" style="width:${pct}%;background:${col}"></div></div>${pct}%</div></td><td style="font-weight:700">${fmt(t.current*t.price)} ر</td></tr>`;}).join('')+'</tbody></table></div>';
  } else {
    const byDay={};
    disp.forEach(m=>{const d=m.date.split(' ')[0]||m.date;if(!byDay[d])byDay[d]={petrol:0,diesel:0,cost:0};byDay[d][m.fuel]+=m.liters;byDay[d].cost+=m.cost;});
    rc.innerHTML='<div class="card-head"><div class="card-title">الصرف اليومي</div></div><div class="tbl-wrap"><table><thead><tr><th>اليوم</th><th>بنزين 91</th><th>ديزل</th><th>التكلفة</th></tr></thead><tbody>'+Object.entries(byDay).map(([d,v])=>`<tr><td style="color:var(--text3)">${d}</td><td style="font-weight:700;color:#b45309">${fmt(v.petrol)} لتر</td><td style="font-weight:700;color:#374151">${fmt(v.diesel)} لتر</td><td style="font-weight:700">${fmt(v.cost)} ر</td></tr>`).join('')+'</tbody></table></div>';
  }
}
function exportCSV(){
  const db=getDB();
  const csv='\uFEFFالتاريخ,النوع,الوقود,الكمية,اللوحة,السائق,التكلفة\n'+db.movements.map(m=>`${m.date},${m.type==='dispense'?'صرف':'استلام'},${fuelLabel(m.fuel)},${m.liters},${m.plate||''},${m.driver||''},${m.cost}`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='تقرير_الوقود.csv';a.click();
  toast('✅ تم التصدير','success');
}
render();
</script></body></html>
