<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الموردون</title><link rel="stylesheet" href="css/main.css"></head>
<body><div class="main">
<div class="topbar"><div><div class="page-title">🏪 الموردون</div><div class="page-sub">موردو الوقود</div></div><div class="topbar-actions"><button class="btn btn-accent btn-sm" onclick="openAdd()">+ إضافة مورد</button></div></div>
<div class="content"><div class="g g3" id="grid"></div></div></div>
<div class="modal-ov" id="m-sup"><div class="modal"><div class="modal-head"><div class="modal-title" id="m-title">إضافة مورد</div><button class="mclose" onclick="closeModal('m-sup')">✕</button></div>
<input type="hidden" id="s-id">
<div class="form-row2"><div class="form-group"><label class="form-label">اسم المورد *</label><input id="s-name" class="form-input"></div><div class="form-group"><label class="form-label">المسؤول</label><input id="s-contact" class="form-input"></div></div>
<div class="form-row2"><div class="form-group"><label class="form-label">رقم الجوال</label><input id="s-phone" class="form-input" type="tel"></div><div class="form-group"><label class="form-label">واتساب (966...)</label><input id="s-wa" class="form-input" dir="ltr"></div></div>
<div class="form-row2"><div class="form-group"><label class="form-label">البريد</label><input id="s-email" class="form-input" type="email" dir="ltr"></div><div class="form-group"><label class="form-label">المدينة</label><input id="s-city" class="form-input"></div></div>
<div class="form-group"><label class="form-label">ملاحظات</label><textarea id="s-notes" class="form-input" rows="2"></textarea></div>
<div class="mfoot"><button class="btn btn-accent" onclick="saveSup()">حفظ</button><button class="btn btn-ghost" onclick="closeModal('m-sup')">إلغاء</button></div>
</div></div>
<script src="js/shared.js"></script>
<script>
requireAuth();loadTheme();buildSidebar('suppliers');
function render(){
  const db=getDB();
  document.getElementById('grid').innerHTML=db.suppliers.map(s=>{
    const wa=s.whatsapp||s.phone?.replace(/^0/,'966');
    return`<div class="card"><div style="display:flex;gap:10px;margin-bottom:12px"><div style="width:40px;height:40px;border-radius:10px;background:#fffbeb;display:flex;align-items:center;justify-content:center;font-size:20px">⛽</div><div style="flex:1"><div style="font-size:13px;font-weight:800;color:var(--text)">${s.name}</div><div style="font-size:11px;color:var(--text3)">${s.contact||''} ${s.city?'| '+s.city:''}</div></div><div style="display:flex;gap:4px"><button class="btn btn-ghost btn-xs" onclick="editSup(${s.id})">✏️</button><button class="btn btn-danger btn-xs" onclick="delSup(${s.id})">🗑️</button></div></div>
    <div style="display:flex;flex-direction:column;gap:6px;font-size:12px">
    ${s.phone?`<div>📞 ${s.phone}</div>`:''}${s.email?`<div>📧 ${s.email}</div>`:''}${s.notes?`<div style="font-size:11px;color:var(--text3);background:var(--bg);padding:6px;border-radius:6px">${s.notes}</div>`:''}
    </div>
    ${wa?`<a href="https://wa.me/${wa}?text=مرحباً، نود الاستفسار عن توريد الوقود" target="_blank" class="btn btn-success btn-sm" style="margin-top:10px;width:100%;justify-content:center;background:#25D366"><svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M11.999 2C6.485 2 2 6.486 2 12c0 1.762.465 3.413 1.277 4.849L2 22l5.233-1.261A9.947 9.947 0 0012 22c5.514 0 10-4.486 10-10S17.513 2 11.999 2z"/></svg> واتساب</a>`:''}
    </div>`;}).join('')||'<div class="card" style="grid-column:1/-1"><div style="text-align:center;padding:40px;color:var(--text3)"><div style="font-size:40px;margin-bottom:10px">🏪</div><div>لا يوجد موردون</div></div></div>';
}
function openAdd(){document.getElementById('m-title').textContent='إضافة مورد';document.getElementById('s-id').value='';['s-name','s-contact','s-phone','s-wa','s-email','s-city','s-notes'].forEach(id=>document.getElementById(id).value='');openModal('m-sup');}
function editSup(id){const db=getDB();const s=db.suppliers.find(x=>x.id===id);if(!s)return;document.getElementById('m-title').textContent='تعديل المورد';document.getElementById('s-id').value=id;document.getElementById('s-name').value=s.name;document.getElementById('s-contact').value=s.contact||'';document.getElementById('s-phone').value=s.phone||'';document.getElementById('s-wa').value=s.whatsapp||'';document.getElementById('s-email').value=s.email||'';document.getElementById('s-city').value=s.city||'';document.getElementById('s-notes').value=s.notes||'';openModal('m-sup');}
function saveSup(){const db=getDB();const name=document.getElementById('s-name').value.trim();if(!name){toast('الاسم مطلوب','error');return;}const data={name,contact:document.getElementById('s-contact').value.trim(),phone:document.getElementById('s-phone').value.trim(),whatsapp:document.getElementById('s-wa').value.trim(),email:document.getElementById('s-email').value.trim(),city:document.getElementById('s-city').value.trim(),notes:document.getElementById('s-notes').value.trim()};const id=parseInt(document.getElementById('s-id').value);if(id){Object.assign(db.suppliers.find(s=>s.id===id),data);}else{db.suppliers.push({id:nextId(db,'supplier'),...data});}saveDB(db);closeModal('m-sup');logActivity(id?'تعديل مورد':'إضافة مورد',name);render();toast('✅ تم الحفظ','success');}
function delSup(id){const db=getDB();const s=db.suppliers.find(x=>x.id===id);if(!s||!confirm(`حذف "${s.name}"؟`))return;db.suppliers=db.suppliers.filter(x=>x.id!==id);saveDB(db);render();toast('🗑️ تم الحذف');}
render();
</script></body></html>
